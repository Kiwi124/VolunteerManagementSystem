{% extends 'base.html' %}
{% block title %}Users{% endblock %}
{% block content %}

<div class='flex justify-between items-center mb-4'>
    <c-lb.text size="3xl" class="font-semibold">Users</c-lb.text>
    <c-lb.button as="a" href="{% url 'accounts:user_create' %}" variant="primary" size="sm">New User</c-lb.button>
</div>

<div class="rounded-box bg-base-100 p-4 shadow-sm">
    <div class="overflow-x-auto">
        <c-lb.table class="w-full text-base">
            <thead>
                <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
            {% for u in users %}
                <tr>
                    <td>{{ u.person }}</td>
                    <td>{{ u.email }}</td>
                    <td>{{ u.role.role_name }}</td>
                    <td>{{ u.get_user_status_display }}</td>
                    <td><c-lb.button as="a" href="{% url 'accounts:user_edit' u.user_id %}" variant="ghost" size="sm">Edit</c-lb.button></td>
                </tr>
            {% empty %}
                <tr><td colspan="5">No users yet.</td></tr>
            {% endfor %}
            </tbody>
        </c-lb.table>
    </div>
</div>

{% endblock %}
