{% extends 'base.html' %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Users</h2>
    <a class="btn btn-primary" href="{% url 'accounts:user_create' %}">New User</a>
</div>
<table class="table table-striped">
    <thead>
        <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>
    </thead>
    <tbody>
    {% for u in users %}
        <tr>
            <td>{{ u.person }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.role.role_name }}</td>
            <td>{{ u.get_user_status_display }}</td>
            <td><a href="{% url 'accounts:user_edit' u.user_id %}">Edit</a></td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
