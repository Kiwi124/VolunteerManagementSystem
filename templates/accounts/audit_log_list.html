{% extends 'base.html' %}
{% block title %}Audit Log{% endblock %}
{% block content %}
<h2>Audit Log</h2>
<table class="table table-striped">
    <thead>
        <tr><th>Timestamp</th><th>User</th><th>Action</th><th>Entity Affected</th></tr>
    </thead>
    <tbody>
    {% for log in logs %}
        <tr>
            <td>{{ log.timestamp }}</td>
            <td>{{ log.user|default:"-" }}</td>
            <td>{{ log.action_performed }}</td>
            <td>{{ log.entity_affected }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
